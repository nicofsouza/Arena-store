<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arena Store - Login</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <div class="logo">
      <img src="logo.png" alt="Arena Store Logo">
      <span>ARENA STORE</span>
    </div>
    <nav>
      <ul>
        <li><a href="Pagina_inicial.html">Home</a></li>
      </ul>
    </nav>
  </header>

  <main class="login-container">
    <div class="login-box">
      <img src="logo.png" alt="Arena Store Logo" class="login-logo">
      <h2>Login</h2>

      <form id="loginForm">
        <input type="text" id="email" placeholder="E-mail" required>
        <input type="password" id="senha" placeholder="Senha" required>
        <button type="submit">Entrar</button>
      </form>

      <p id="mensagem" style="margin-top: 10px;"></p>

      <div class="links">
        <a href="cadastro.html">Criar conta</a> ·
        <a href="trocar_senha.html">Esqueceu a Senha?</a>
      </div>
    </div>
  </main>

  <script>
    const form = document.getElementById('loginForm');
    const msg = document.getElementById('mensagem');

    // 🔐 Dados do admin fixo (você pode alterar depois)
    const ADMIN_EMAIL = "admin@admin.com";
    const ADMIN_SENHA = "123456";

    form.addEventListener('submit', (event) => {
      event.preventDefault();

      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('senha').value.trim();

      const usuarios = JSON.parse(localStorage.getItem('usuarios')) || [];

      // ===============================
      // 🔥 LOGIN ADMINISTRADOR
      // ===============================
      if (email === ADMIN_EMAIL && senha === ADMIN_SENHA) {

        localStorage.setItem("adminLogado", "true");

        msg.style.color = "green";
        msg.textContent = "Bem-vindo, administrador!";

        setTimeout(() => {
          window.location.href = "adm.html";
        }, 800);

        return;
      }

      // ===============================
      // 🔥 LOGIN DE USUÁRIO COMUM
      // ===============================
      const usuarioEncontrado = usuarios.find(
        (user) => user.email === email && user.senha === senha
      );

      if (usuarioEncontrado) {

        msg.style.color = "green";
        msg.textContent = `Bem-vindo(a), ${usuarioEncontrado.nome}!`;

        localStorage.setItem("usuarioLogado", JSON.stringify(usuarioEncontrado));

        setTimeout(() => {
          window.location.href = "Pagina_inicial.html";
        }, 800);

        return;
      }

      // ===============================
      // ❌ ERRO NO LOGIN
      // ===============================
      msg.style.color = "red";
      msg.textContent = "E-mail ou senha incorretos!";
    });
  </script>

</body>

</html>
