<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administração - Arena Store</title>
    <link rel="stylesheet" href="adm.css">
</head>

<body>

    <div class="sidebar">
        <h2>Arena Store ADM</h2>
        <ul>
            <li onclick="mostrarTela('dashboard')">📊 Dashboard</li>
            <li onclick="mostrarTela('produtos')">🛒 Produtos</li>
            <li onclick="mostrarTela('novo-produto')">➕ Novo Produto</li>
        </ul>

        <button class="btn-voltar" onclick="window.location.href='Pagina_inicial.html'">
             ⬅️ Voltar para a Loja
        </button>
    </div>

    <div class="conteudo">

        <!-- DASHBOARD -->
        <section id="dashboard" class="tela ativa">
            <h1>Dashboard</h1>
            <div class="cards">
                <div class="card">
                    <h3>Total de Produtos</h3>
                    <p id="total-produtos">0</p>
                </div>
                <div class="card">
                    <h3>Vendas Hoje</h3>
                    <p id="vendas-hoje">0</p>
                </div>
                <div class="card">
                    <h3>Estoque Total</h3>
                    <p id="estoque-total">0</p>
                </div>
            </div>
        </section>

        <!-- LISTA DE PRODUTOS -->
        <section id="produtos" class="tela">
            <h1>Todos os Produtos</h1>
            <table>
                <thead>
                    <tr>
                        <th>Imagem</th>
                        <th>Nome</th>
                        <th>Preço</th>
                        <th>Estoque</th>
                        <th>Categoria</th>
                        <th>Esporte</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="lista-produtos"></tbody>
            </table>
        </section>

        <!-- CRIAR NOVO PRODUTO -->
        <section id="novo-produto" class="tela">
            <h1>Novo Produto</h1>

            <form id="form-produto">
                <label>Nome do Produto:</label>
                <input type="text" id="nome" required>

                <label>Preço (R$):</label>
                <input type="number" id="preco" required>

                <label>Estoque (unidades):</label>
                <input type="number" id="estoque" required>

                <label>Categoria:</label>
                <select id="categoria">
                    <option value="camisa">Camisa</option>
                    <option value="acessorio">Acessório</option>
                    <option value="tenis">Tênis</option>
                    <option value="short">Short</option>
                    <option value="chuteira">Chuteira</option>
                </select>

                <label>Esporte:</label>
                <select id="esporte">
                    <option value="futebol">Futebol</option>
                    <option value="basquete">Basquete</option>
                </select>

                <label>Imagem do Produto:</label>
                <input type="file" id="imagem" accept="image/*">

                <button type="submit">Salvar Produto</button>
            </form>
        </section>

    </div>

    <script src="adm.js"></script>
</body>

</html>
