<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todos os Produtos - Arena Store</title>

    <link rel="stylesheet" href="todosprodutos.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <div class="logo">
            <img src="logo.png" alt="Logo Arena Store">
            <h1>ARENA STORE</h1>
        </div>

        <nav>
            <a href="pagina_inicial.html">Início</a>
            <a href="futebol.html">Futebol</a>
            <a href="basquete.html">Basquete</a>
            <a href="acessorios.html">Acessórios</a>

            <a href="todosprodutos.html" class="active">Produtos</a>
        </nav>

        <div class="auth">
            <a id="nome-usuario"></a>
            
        </div>
    </header>

    <!-- BANNER -->
    <section class="banner">
        <div class="banner-content">
            <h1>🛒 Todos os Produtos</h1>
            <p>Camisas • Acessórios • Tênis • Coleções completas</p>
        </div>
    </section>

    <!-- FILTRO -->
    <section class="categorias">
        <button onclick="filtrar('todos')" class="ativo">Todos</button>
        <button onclick="filtrar('camisas')">Camisas</button>
        <button onclick="filtrar('acessorios')">Acessórios</button>
        <button onclick="filtrar('tenis')">Tênis</button>
        <button onclick="filtrar('basquete')">Basquete</button>
        <button onclick="filtrar('futebol')">Futebol</button>
    </section>

    <!-- TODOS OS PRODUTOS -->
    <section id="produtos" class="produtos">

        <!-- *EXEMPLOS* - só copiar seus produtos reais depois -->

        <!-- CAMISAS -->
        <div class="produto camisas futebol">
            <img src="imagens futebol/camisa1.png" alt="">
            <h3>Camisa Flamengo</h3>
            <p class="preco">R$ 129,90</p>
            <button class="btn-comprar">Comprar</button>
        </div>

        <div class="produto camisas basquete">
            <img src="imagens camisar/1.png" alt="">
            <h3>Camisa NBA Bulls</h3>
            <p class="preco">R$ 199,90</p>
            <button class="btn-comprar">Comprar</button>
        </div>

        <!-- ACESSÓRIOS -->
        <div class="produto acessorios">
            <img src="imagens acessorios/10 (1).png" alt="">
            <h3>Bola Oficial NBA</h3>
            <p class="preco">R$ 149,90</p>
            <button class="btn-comprar">Comprar</button>
        </div>

        <!-- TÊNIS -->
        <div class="produto tenis basquete">
            <img src="imagens acessorios/8.png" alt="">
            <h3>Tênis Nike Giannis</h3>
            <p class="preco">R$ 599,90</p>
            <button class="btn-comprar">Comprar</button>
        </div>

        <div class="produto tenis futebol">
            <img src="imagens futebol/chuteira1.png" alt="">
            <h3>Chuteira Adidas Predator</h3>
            <p class="preco">R$ 349,90</p>
            <button class="btn-comprar">Comprar</button>
        </div>

    </section>

    <script src="todosprodutos.js"></script>
</body>

</html>
